<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Perfect Thingy</title>
  <meta name="description" content="The Perfect Thingy — art, books, and other curious things by Jayme Hunt.">

  <style>
    :root {
      font-family: Georgia, "Times New Roman", serif;
      color: #25221f;
      background: #f7f4ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(720px, 100%);
    }

    h1 {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      line-height: .95;
      margin: 0 0 1rem;
      font-weight: 500;
    }

    .intro {
      font-size: 1.2rem;
      line-height: 1.6;
      max-width: 38rem;
      margin-bottom: 3rem;
    }

    section {
      border-top: 1px solid #c9c1b5;
      padding-top: 1.5rem;
    }

    h2 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-family: Arial, sans-serif;
      margin-bottom: 1.5rem;
    }

    .work {
      display: block;
      padding: 1.25rem 0;
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid #ded7cd;
    }

    .work strong {
      display: block;
      font-size: 1.6rem;
      margin-bottom: .3rem;
    }

    .work span {
      font-family: Arial, sans-serif;
      font-size: .95rem;
    }

    .work:hover strong {
      text-decoration: underline;
    }

    footer {
      margin-top: 4rem;
      font-family: Arial, sans-serif;
      font-size: .8rem;
      color: #716a62;
    }
  </style>
</head>

<body>
  <main>
    <h1>The Perfect Thingy</h1>

    <p class="intro">
      Art, books, experiments, and whatever else turns out to be the perfect thingy.
    </p>

<section>
  <h2>Now Available</h2>

  <a class="work"
     href="https://fineartamerica.com/profiles/1-jayme-hunt/shop">
    <strong>Jayme Hunt Art</strong>
    <span>Original watercolor art — fine-art prints, greeting cards, and selected products →</span>
  </a>
</section>

    <footer>
      © 2026 Jayme Hunt
    </footer>
  </main>
</body>
</html>
