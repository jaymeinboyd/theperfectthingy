<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jayme T Hunt | The Perfect Thingy</title>
  <meta name="description" content="Connect with Jayme T Hunt of The Perfect Thingy. Save contact details, call, email, or learn how Jayme helps small businesses make their knowledge usable.">
  <meta name="theme-color" content="#F6F2EB">
  <style>
    :root { --cream:#F6F2EB; --teal:#2F6B6D; --soft:#85A9AA; --taupe:#A6937D; --mist:#E4ECEC; --ink:#303534; }
    * { box-sizing:border-box; }
    body {
      min-height:100vh; margin:0; padding:24px;
      display:grid; place-items:center;
      color:var(--ink); background:var(--cream);
      font-family:Georgia,"Times New Roman",serif;
    }
    main {
      width:min(470px,100%); padding:34px 30px 30px;
      text-align:center; border:1px solid rgba(47,107,109,.22);
      border-radius:30px; background:rgba(255,255,255,.32);
      box-shadow:0 18px 55px rgba(48,53,52,.12);
    }
    .logo { display:block; width:min(340px,92%); height:auto; margin:0 auto 28px; }
    .name {
      margin:0; color:var(--teal);
      font:700 .78rem/1.2 Arial,sans-serif;
      letter-spacing:.2em; text-transform:uppercase;
    }
    .role { margin:8px 0 28px; font:400 .92rem/1.4 Arial,sans-serif; }
    h1 { margin:0 auto; max-width:390px; font-size:clamp(1.8rem,7vw,2.55rem); line-height:1.08; font-weight:500; }
    .answer { margin:14px 0 22px; color:var(--teal); font-size:clamp(2rem,8vw,2.85rem); line-height:1.04; }
    .filigree { margin:0 0 24px; color:var(--soft); font-size:1.35rem; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .action {
      min-height:50px; display:grid; place-items:center; padding:12px 10px;
      border:1px solid var(--teal); color:var(--teal); background:transparent;
      text-decoration:none; font:700 .8rem/1.2 Arial,sans-serif;
      letter-spacing:.045em;
    }
    .action.primary, .action.full { grid-column:1 / -1; }\n    .action.primary { color:white; background:var(--teal); }
    .action:focus-visible { outline:3px solid var(--soft); outline-offset:3px; }
    .contact {
      margin:24px 0 0; color:#5e615f;
      font:400 .82rem/1.65 Arial,sans-serif;
    }
    .contact a { color:var(--teal); text-decoration:none; }
    .home {
      display:inline-block; margin-top:20px; color:var(--taupe);
      font:400 .78rem/1.4 Arial,sans-serif; text-decoration:none;
    }
    @media (max-width:390px) {
      body { padding:10px; }
      main { padding:28px 18px 24px; border-radius:22px; }
      .actions { grid-template-columns:1fr; }
      .action.primary, .action.full { grid-column:auto; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="../business/assets/the-perfect-thingy-logo-no-tagline.png" alt="The Perfect Thingy">
    <p class="name">Jayme T Hunt</p>
    <p class="role">AI Business System Implementation</p>
    <h1>Your business already contains more useful knowledge than you can see.</h1>
    <p class="answer">I help you make it usable.</p>
    <div class="filigree" aria-hidden="true">— ❦ —</div>
    <div class="actions" aria-label="Contact options">
      <a class="action primary" href="jayme-hunt.vcf" download>Save Jayme’s contact</a>
      <a class="action" href="tel:+17017079092">Call</a>
      <a class="action" href="mailto:founder@theperfectthingy.com">Email</a>
      <a class="action full" href="../business/">How it works</a>
    </div>
    <p class="contact">
      <a href="tel:+17017079092">(701) 707-9092</a><br>
      <a href="mailto:founder@theperfectthingy.com">founder@theperfectthingy.com</a>
    </p>
    <a class="home" href="../business/">theperfectthingy.com/business</a>
  </main>
</body>
</html>
